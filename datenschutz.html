  <style>
    :root{
      --bg:#0b0f18;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:#e5e7eb;
      --pill:#111827;
      --pillText:#e5e7eb;
      --accent:#2563eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", Arial;
      background: radial-gradient(1200px 700px at 20% -10%, rgba(37,99,235,.35), transparent 60%),
                  radial-gradient(900px 600px at 90% 0%, rgba(99,102,241,.25), transparent 55%),
                  var(--bg);
      color: var(--pillText);
    }
    .topbar{
      max-width: 980px;
      margin: 28px auto 14px;
      padding: 0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex; align-items:center; gap:10px; font-weight:700;
      letter-spacing:.2px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background: var(--accent);
      box-shadow:0 0 18px rgba(37,99,235,.7);
    }
    .nav{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .pill{
      border:1px solid rgba(229,231,235,.18);
      background: rgba(17,24,39,.55);
      color: var(--pillText);
      padding:10px 14px;
      border-radius:999px;
      text-decoration:none;
      font-weight:600;
      font-size:14px;
      backdrop-filter: blur(8px);
    }
    .pill.active{
      border-color: rgba(37,99,235,.75);
      box-shadow: 0 0 0 3px rgba(37,99,235,.18);
    }
    .lang{
      display:flex; align-items:center; gap:10px;
    }
    .lang label{font-size:14px; opacity:.9}
    select{
      border-radius: 10px;
      border:1px solid rgba(229,231,235,.25);
      background: rgba(17,24,39,.55);
      color: var(--pillText);
      padding:10px 12px;
      font-weight:700;
      outline:none;
      cursor:pointer;
      backdrop-filter: blur(8px);
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto 40px;
      padding: 0 16px;
    }
    .card{
      background: var(--card);
      color: var(--text);
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
    }
    .headerRow{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom: 8px;
    }
    h1{
      margin:0 0 8px 0;
      font-size: 34px;
      line-height:1.15;
      letter-spacing:-.2px;
    }
    .rightTag{
      font-weight:700;
      color: var(--muted);
      white-space:nowrap;
      padding-top:8px;
    }
    .note{
      background:#f8fafc;
      border:1px solid var(--line);
      padding:12px 14px;
      border-radius:12px;
      color:#0f172a;
      margin: 10px 0 18px;
    }
    h2{
      margin:22px 0 8px;
      font-size: 18px;
      letter-spacing:.1px;
    }
    p{margin:8px 0; line-height:1.55; color:#0f172a}
    ul{margin:8px 0 8px 18px; color:#0f172a}
    li{margin:6px 0}
    .small{color: var(--muted); font-size: 14px}
    a{color: var(--accent)}

      max-width: 980px;
      margin: 18px auto 24px;

</head>

  const langSelect = document.getElementById("langSelect");
  const langLabel = document.getElementById("langLabel");
  const titleEl = document.getElementById("title");
  const noteEl = document.getElementById("bindingNote");
  const contentEl = document.getElementById("content");

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  function render(lang){
    const t = TEXT[lang] || TEXT.DE;

    // Set HTML lang attribute roughly
    document.documentElement.lang = (lang === "DE") ? "de" : (lang === "EN") ? "en" : (lang === "TR") ? "tr" : "ru";

    langLabel.textContent = t.langLabel;
    titleEl.textContent = t.title;
    noteEl.innerHTML = t.bindingNote;

    const parts = [];
    for(const s of t.sections){
      parts.push(`<h2>${escapeHtml(s.h)}</h2>`);
      if(s.p){
        for(const para of s.p){
          parts.push(`<p>${para}</p>`);
        }
      }
      if(s.ul){
        parts.push("<ul>");
        for(const li of s.ul){
          parts.push(`<li>${escapeHtml(li)}</li>`);
        }
        parts.push("</ul>");
      }
      if(s.p2){
        for(const para of s.p2){
          parts.push(`<p>${para}</p>`);
        }
      }
    }
    contentEl.innerHTML = parts.join("\n");
  }

  function getLangFromUrl(){
    const url = new URL(window.location.href);
    const q = (url.searchParams.get("lang") || "").toUpperCase().trim();
    if(["DE","EN","TR","RU"].includes(q)) return q;
    return null;
  }

  const saved = (localStorage.getItem("briefhelden_lang") || "").toUpperCase();
  const fromUrl = getLangFromUrl();
  const initial = fromUrl || (["DE","EN","TR","RU"].includes(saved) ? saved : "DE");

  langSelect.value = initial;
  render(initial);

  langSelect.addEventListener("change", () => {
    const lang = langSelect.value;
    localStorage.setItem("briefhelden_lang", lang);
    render(lang);

    // Optional: keep URL clean but store choice; or set ?lang=
    const url = new URL(window.location.href);
    url.searchParams.set("lang", lang);
    window.history.replaceState({}, "", url.toString());
  });
})();
