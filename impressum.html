.wrap{max-width:980px;margin:auto;padding:0 16px}
.card{background:#fff;color:#0f172a;border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}

h2{margin-top:22px}
.note{background:#f8fafc;padding:12px;border-radius:10px;margin-bottom:18px;color:#0f172a}
.p{color:#0f172a}
