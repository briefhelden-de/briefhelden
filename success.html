<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BriefHelden – Zahlung erfolgreich</title>

<style>
:root{
--bg:#0b0f18;
--card:#ffffff;
--text:#0f172a;
--muted:#475569;
--accent:#2563eb;
}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:
radial-gradient(1200px 700px at 20% -10%, rgba(37,99,235,.35), transparent 60%),
radial-gradient(900px 600px at 90% 0%, rgba(99,102,241,.25), transparent 55%),
var(--bg);
color:#e5e7eb;
}

.wrap{
max-width:900px;
margin:auto;
padding:24px 16px;
}

h1{
margin-top:10px;
font-size:32px;
}

.card{
margin-top:22px;
background:#fff;
color:#0f172a;
border-radius:18px;
padding:26px 22px;
box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.steps{
margin-top:12px;
line-height:1.6;
}

.step{
margin:6px 0;
}

.btn{
display:inline-block;
margin-top:18px;
padding:14px 18px;
border-radius:14px;
background:#2563eb;
color:#fff;
text-decoration:none;
font-weight:700;
}

.note{
margin-top:18px;
background:#f8fafc;
padding:12px;
border-radius:10px;
font-size:14px;
}

.footer{
margin-top:22px;
font-size:13px;
opacity:.8;
}
</style>
</head>

<body>

<div class="wrap">

<h1 id="title"></h1>

<div class="card">

<p id="intro"></p>

<div class="steps">

<div class="step" id="s1"></div>
<div class="step" id="s2"></div>
<div class="step" id="s3"></div>

</div>

<a id="btn" class="btn"></a>

<div class="note" id="note"></div>

<p class="footer" id="footer"></p>

</div>

</div>

<script>

const TEXT = {

de:{
title:"Zahlung erfolgreich ✅",
intro:"Vielen Dank für Ihre Bestellung bei BriefHelden.",
s1:"1️⃣ Laden Sie jetzt Ihren Brief oder Ihr Dokument über das Upload-Formular hoch.",
s2:"2️⃣ Wir erstellen eine verständliche Erklärung des Schreibens.",
s3:"3️⃣ Sie erhalten die Erklärung anschließend per E-Mail.",
btn:"Zum Upload-Formular",
note:"Hinweis: Bitte laden Sie nur Dokumente hoch, die für die Erklärung erforderlich sind. Schwärzen Sie sensible Daten, wenn diese für das Verständnis nicht notwendig sind.",
footer:"BriefHelden bietet keine Rechtsberatung. Es erfolgt ausschließlich eine verständliche Erklärung von Dokumenten."
},

en:{
title:"Payment successful ✅",
intro:"Thank you for your order at BriefHelden.",
s1:"1️⃣ Please upload your letter or document using the upload form.",
s2:"2️⃣ We will create a clear explanation of the document.",
s3:"3️⃣ You will receive the explanation by email.",
btn:"Go to upload form",
note:"Note: Please upload only documents required for the explanation. Remove sensitive information if it is not necessary.",
footer:"BriefHelden does not provide legal advice. The service only explains documents in plain language."
},

tr:{
title:"Ödeme başarılı ✅",
intro:"BriefHelden siparişiniz için teşekkür ederiz.",
s1:"1️⃣ Şimdi mektubunuzu veya belgenizi yükleme formu üzerinden yükleyin.",
s2:"2️⃣ Belgenin anlaşılır bir açıklamasını oluşturuyoruz.",
s3:"3️⃣ Açıklamayı daha sonra e-posta ile alacaksınız.",
btn:"Yükleme formuna git",
note:"Not: Lütfen yalnızca açıklama için gerekli belgeleri yükleyin. Gerekli değilse hassas verileri gizleyin.",
footer:"BriefHelden hukuki danışmanlık vermez. Hizmet yalnızca belgelerin anlaşılır şekilde açıklanmasını sağlar."
},

ru:{
title:"Оплата прошла успешно ✅",
intro:"Спасибо за ваш заказ в BriefHelden.",
s1:"1️⃣ Загрузите ваше письмо или документ через форму загрузки.",
s2:"2️⃣ Мы подготовим понятное объяснение документа.",
s3:"3️⃣ Вы получите объяснение по электронной почте.",
btn:"Перейти к форме загрузки",
note:"Примечание: загружайте только документы, необходимые для объяснения. Удалите чувствительные данные, если они не требуются.",
footer:"BriefHelden не предоставляет юридические консультации. Сервис только объясняет документы простым языком."
}

};

const params = new URLSearchParams(location.search);

const lang =
(params.get("lang") ||
localStorage.getItem("bh_lang") ||
"de").toLowerCase();

const L = TEXT[lang] ? lang : "de";

localStorage.setItem("bh_lang",L);

document.documentElement.lang=L;

document.getElementById("title").innerText=TEXT[L].title;
document.getElementById("intro").innerText=TEXT[L].intro;
document.getElementById("s1").innerText=TEXT[L].s1;
document.getElementById("s2").innerText=TEXT[L].s2;
document.getElementById("s3").innerText=TEXT[L].s3;

const btn=document.getElementById("btn");
btn.innerText=TEXT[L].btn;

const form=params.get("form") || "/";

btn.href=form;

document.getElementById("note").innerText=TEXT[L].note;
document.getElementById("footer").innerText=TEXT[L].footer;

</script>

</body>
</html>
