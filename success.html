<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BriefHelden – Zahlung erfolgreich</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b2230;color:#fff}
    .wrap{max-width:900px;margin:0 auto;padding:24px 18px}
    .card{
      margin-top:22px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.18);
      border-radius:18px;
      padding:18px 16px;
      box-shadow: 0 18px 42px rgba(0,0,0,.18);
    }
    .btn{
      display:inline-block;
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      background: rgba(47,110,230,.92);
      color:#fff;
      text-decoration:none;
      font-weight:950;
      border:1px solid rgba(47,110,230,.92);
    }
    .small{opacity:.86;line-height:1.5}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="t1">Zahlung erfolgreich ✅</h1>

    <div class="card">
      <p class="small" id="t2">
        Danke! Als nächstes laden Sie bitte Ihren Brief / Ihr Formular hoch. Danach bekommen Sie die Erklärung per E-Mail.
      </p>

      <a class="btn" id="goBtn" href="#">Zum Upload-Formular</a>

      <p class="small" style="margin-top:12px" id="t3">
        Hinweis: Die deutsche Version ist rechtlich maßgeblich. Übersetzungen dienen nur der besseren Verständlichkeit.
      </p>
    </div>
  </div>

<script>
  const dict = {
    de: {
      t1:"Zahlung erfolgreich ✅",
      t2:"Danke! Als nächstes laden Sie bitte Ihren Brief / Ihr Formular hoch. Danach bekommen Sie die Erklärung per E-Mail.",
      btn:"Zum Upload-Formular",
      t3:"Hinweis: Die deutsche Version ist rechtlich maßgeblich. Übersetzungen dienen nur der besseren Verständlichkeit."
    },
    en: {
      t1:"Payment successful ✅",
      t2:"Thank you! Next, please upload your letter / form. You will then receive the explanation by email.",
      btn:"Go to upload form",
      t3:"Note: The German version is legally binding. Translations are for convenience only."
    },
    tr: {
      t1:"Ödeme başarılı ✅",
      t2:"Teşekkürler! Şimdi lütfen mektubunuzu / formunuzu yükleyin. Daha sonra açıklamayı e-posta ile alırsınız.",
      btn:"Yükleme formuna git",
      t3:"Not: Hukuken bağlayıcı olan sürüm Almanca sürümdür. Çeviriler kolaylık içindir."
    },
    ru: {
      t1:"Оплата прошла успешно ✅",
      t2:"Спасибо! Далее загрузите письмо / форму. Затем вы получите объяснение по e-mail.",
      btn:"Перейти к форме загрузки",
      t3:"Примечание: юридически действует немецкая версия. Переводы — только для удобства."
    }
  };

  const params = new URLSearchParams(location.search);
  const lang = (params.get("lang") || localStorage.getItem("bh_lang") || "de").toLowerCase();
  const l = dict[lang] ? lang : "de";

  localStorage.setItem("bh_lang", l);
  document.documentElement.lang = l;

  document.getElementById("t1").innerText = dict[l].t1;
  document.getElementById("t2").innerText = dict[l].t2;
  document.getElementById("t3").innerText = dict[l].t3;

  const form = params.get("form") || "";
  const btn = document.getElementById("goBtn");
  btn.innerText = dict[l].btn;

  // Wenn du willst: Auto-Weiterleitung nach 2 Sekunden (optional)
  // const AUTO_REDIRECT_MS = 2000;

  if(form){
    btn.href = form;
    // setTimeout(()=>location.href=form, AUTO_REDIRECT_MS);
  } else {
    btn.href = "/"; // fallback
  }
</script>
</body>
</html>
