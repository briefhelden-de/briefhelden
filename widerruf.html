<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widerruf – BriefHelden</title>
  <style>
    :root{
      --bg:#0b0f18;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:#e5e7eb;
      --pill:#111827;
      --pillText:#e5e7eb;
      --accent:#2563eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(37,99,235,.35), transparent 60%),
        radial-gradient(900px 600px at 90% 0%, rgba(99,102,241,.25), transparent 55%),
        var(--bg);
      color:var(--pillText);
    }
    .topbar{
      max-width:980px;
      margin:28px auto 14px;
      padding:0 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      letter-spacing:.2px;
    }
    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 18px rgba(37,99,235,.7);
    }
    .nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .pill{
      border:1px solid rgba(229,231,235,.18);
      background:rgba(17,24,39,.55);
      color:var(--pillText);
      padding:10px 14px;
      border-radius:999px;
      text-decoration:none;
      font-weight:600;
      font-size:14px;
      backdrop-filter:blur(8px);
    }
    .pill.active{
      border-color:rgba(37,99,235,.75);
      box-shadow:0 0 0 3px rgba(37,99,235,.18);
    }
    .lang{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .lang label{font-size:14px;opacity:.9}
    select{
      border-radius:10px;
      border:1px solid rgba(229,231,235,.25);
      background:rgba(17,24,39,.55);
      color:var(--pillText);
      padding:10px 12px;
      font-weight:700;
      outline:none;
      cursor:pointer;
      backdrop-filter:blur(8px);
    }
    .wrap{
      max-width:980px;
      margin:0 auto 40px;
      padding:0 16px;
    }
    .card{
      background:var(--card);
      color:var(--text);
      border-radius:18px;
      padding:26px 22px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
    }
    .headerRow{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:8px;
      flex-wrap:wrap;
    }
    h1{
      margin:0 0 8px 0;
      font-size:34px;
      line-height:1.15;
      letter-spacing:-.2px;
    }
    .rightTag{
      font-weight:700;
      color:var(--muted);
      white-space:nowrap;
      padding-top:8px;
    }
    .note{
      background:#f8fafc;
      border:1px solid var(--line);
      padding:12px 14px;
      border-radius:12px;
      color:#0f172a;
      margin:10px 0 18px;
    }
    h2{
      margin:22px 0 8px;
      font-size:18px;
      letter-spacing:.1px;
    }
    p{
      margin:8px 0;
      line-height:1.6;
      color:#0f172a;
    }
    ul{
      margin:8px 0 8px 18px;
      color:#0f172a;
    }
    li{margin:6px 0}
    .small{
      color:var(--muted);
      font-size:14px;
    }
    a{color:var(--accent)}
    .footer{
      max-width:980px;
      margin:18px auto 24px;
      padding:0 16px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      color:rgba(229,231,235,.85);
      font-size:13px;
    }
    .footer a{
      color:rgba(229,231,235,.95);
      text-decoration:none;
      border-bottom:1px dashed rgba(229,231,235,.45);
    }
    .footer a:hover{
      border-bottom-color:rgba(229,231,235,.9);
    }
  </style>
</head>
<body>

        <h2>4. Vorzeitiges Erlöschen des Widerrufsrechts</h2>
        <p>Bei digitalen Dienstleistungen kann das Widerrufsrecht vorzeitig erlöschen, wenn wir mit der Ausführung der Leistung begonnen haben, nachdem Sie</p>
        <ul>
          <li>ausdrücklich zugestimmt haben, dass wir vor Ablauf der Widerrufsfrist mit der Ausführung beginnen, und</li>
          <li>bestätigt haben, dass Sie durch diese Zustimmung mit Beginn der Ausführung Ihr Widerrufsrecht verlieren.</li>

        <p>BriefHelden erbringt digitale Dienstleistungen in Form einer verständlichen sprachlichen Erklärung von eingereichten Schreiben und Dokumenten.</p>
        <p>Wenn Sie im Bestell- oder Anfrageprozess ausdrücklich zustimmen, dass wir vor Ablauf der Widerrufsfrist mit der Bearbeitung beginnen, und Sie gleichzeitig bestätigen, dass Sie dadurch Ihr Widerrufsrecht verlieren, erlischt Ihr Widerrufsrecht mit Beginn der Ausführung der Leistung.</p>

      `
    },

    EN: {

        </ul>

        <p>If, during the order or request process, you expressly agree that we begin processing before the withdrawal period expires and at the same time confirm that you thereby lose your right of withdrawal, your right of withdrawal expires once performance begins.</p>

        <p>If a valid right of withdrawal exists and has not yet expired, refunds will be made in accordance with the applicable legal requirements.</p>
        <p>If the right of withdrawal has expired due to your express consent and the beginning of processing, there is no entitlement to a refund for the digital service already started or fully performed.</p>

        <p>For the early expiry of the right of withdrawal to be effective, your express consent must be obtained separately during the order or form process.</p>
      `
    },

    TR: {

      note: "<strong>Not:</strong> Hukuken bağlayıcı olan sürüm Almanca sürümdür. Çeviriler yalnızca kolaylık içindir.",
      content: `
        <h2>1. Cayma hakkı</h2>
        <p>Tüketiciler, mesafeli sözleşmelerde genel olarak on dört gün içinde herhangi bir gerekçe göstermeden sözleşmeden cayma hakkına sahiptir.</p>

        <p>
          <strong>David Hirschfeld – BriefHelden</strong><br>
          Carl-Maria-von-Weber-Str. 2<br>
          74928 Hüffenhardt<br>
          Almanya<br><br>
          <strong>E-posta:</strong> ${EMAIL_LINK}
        </p>

        <p>Sözleşmeden caymanız halinde, sizden aldığımız tüm ödemeleri, cayma bildiriminizin bize ulaştığı tarihten itibaren en geç on dört gün içinde iade ederiz.</p>
        <p>Aksi açıkça kararlaştırılmadıkça, geri ödeme için ilk işlemde kullandığınız ödeme yöntemini kullanırız.</p>

        <h2>4. Cayma hakkının erken sona ermesi</h2>
        <p>Dijital hizmetlerde cayma hakkı, aşağıdaki durumlarda erken sona erebilir:</p>
        <ul>
          <li>hizmetin cayma süresi dolmadan başlamasını açıkça kabul etmeniz ve</li>
          <li>hizmetin başlamasıyla cayma hakkınızı kaybedeceğinizi onaylamanız.</li>
        </ul>

        <h2>5. BriefHelden hakkında bilgi</h2>
        <p>BriefHelden, gönderilen yazı ve belgelerin anlaşılır dille açıklanması şeklinde dijital hizmet sunar.</p>
        <p>Sipariş veya başvuru sürecinde, hizmetin cayma süresi dolmadan başlamasını açıkça kabul eder ve bu nedenle cayma hakkınızı kaybedeceğinizi onaylarsanız, hizmetin başlamasıyla cayma hakkınız sona erer.</p>

        <h2>6. İade</h2>
        <p>Geçerli bir cayma hakkı mevcutsa ve henüz sona ermemişse, geri ödeme yasal hükümlere göre yapılır.</p>
        <p>Ancak açık onayınız ve işlemin başlaması nedeniyle cayma hakkı sona ermişse, başlanmış veya tamamen yerine getirilmiş dijital hizmet için iade hakkı yoktur.</p>

        <h2>7. Önemli not</h2>
        <p>Cayma hakkının erken sona ermesinin geçerli olabilmesi için açık onayınızın sipariş veya form sürecinde ayrıca alınması gerekir.</p>
      `
    },

    RU: {
      langLabel: "Язык",
      title: "Информация об отказе и возврате",
      note: "<strong>Примечание:</strong> Юридически обязательной является немецкая версия. Переводы приведены только для удобства.",
      content: `
        <h2>1. Право на отказ</h2>
        <p>Потребители, как правило, имеют право отказаться от дистанционного договора в течение четырнадцати дней без указания причин.</p>
        <p>Срок отказа составляет четырнадцать дней с даты заключения договора.</p>

        <h2>2. Осуществление отказа</h2>
        <p>Чтобы воспользоваться правом на отказ, вы должны сообщить нам по адресу:</p>
        <p>
          <strong>David Hirschfeld – BriefHelden</strong><br>
          Carl-Maria-von-Weber-Str. 2<br>
          74928 Hüffenhardt<br>
          Германия<br><br>
          <strong>Email:</strong> ${EMAIL_LINK}
        </p>
        <p>посредством однозначного заявления, например по электронной почте, о своём решении отказаться от договора.</p>

        <h2>3. Последствия отказа</h2>
        <p>Если вы отказываетесь от договора, мы вернём все полученные от вас платежи без неоправданной задержки и не позднее четырнадцати дней с момента получения вашего уведомления.</p>
        <p>Возврат осуществляется тем же способом оплаты, который вы использовали при первоначальной операции, если иное прямо не согласовано.</p>

        <h2>4. Досрочное прекращение права на отказ</h2>
        <p>Для цифровых услуг право на отказ может прекратиться досрочно, если мы начали исполнение услуги после того, как вы</p>
        <ul>
          <li>прямо согласились на начало оказания услуги до истечения срока отказа, и</li>
          <li>подтвердили, что с началом исполнения вы теряете право на отказ.</li>
        </ul>

        <h2>5. Уведомление относительно BriefHelden</h2>
        <p>BriefHelden оказывает цифровые услуги в форме понятного языкового объяснения переданных писем и документов.</p>
        <p>Если в процессе заказа или запроса вы прямо соглашаетесь на начало обработки до истечения срока отказа и одновременно подтверждаете потерю права на отказ, это право прекращается с началом исполнения услуги.</p>

        <h2>6. Возврат средств</h2>
        <p>Если действительное право на отказ существует и ещё не прекратилось, возврат осуществляется в соответствии с применимыми правовыми требованиями.</p>
        <p>Если право на отказ прекратилось в связи с вашим прямым согласием и началом обработки, право на возврат за уже начатую или полностью оказанную цифровую услугу отсутствует.</p>

        <h2>7. Важное примечание</h2>
        <p>Чтобы досрочное прекращение права на отказ было действительным, ваше прямое согласие должно быть получено отдельно в процессе заказа или заполнения формы.</p>
      `
    }
  };

  const langSelect = document.getElementById("langSelect");
  const title = document.getElementById("title");
  const note = document.getElementById("note");
  const content = document.getElementById("content");
  const langLabel = document.getElementById("langLabel");

  function render(lang){
    const t = TEXT[lang] || TEXT.DE;

    document.documentElement.lang =
      (lang === "DE") ? "de" :
      (lang === "EN") ? "en" :
      (lang === "TR") ? "tr" : "ru";

    langLabel.textContent = t.langLabel;
    title.innerHTML = t.title;
    note.innerHTML = t.note;
    content.innerHTML = t.content;
  }

  function getLangFromUrl(){
    const url = new URL(window.location.href);
    const q = (url.searchParams.get("lang") || "").toUpperCase().trim();
    if(["DE","EN","TR","RU"].includes(q)) return q;
    return null;
  }

  const saved = (localStorage.getItem("briefhelden_lang") || "").toUpperCase();
  const fromUrl = getLangFromUrl();
  const initial = fromUrl || (["DE","EN","TR","RU"].includes(saved) ? saved : "DE");

  langSelect.value = initial;
  render(initial);

  langSelect.addEventListener("change", () => {
    const lang = langSelect.value;
    localStorage.setItem("briefhelden_lang", lang);
    render(lang);

    const url = new URL(window.location.href);
    url.searchParams.set("lang", lang);
    window.history.replaceState({}, "", url.toString());
  });
})();
</script>
</body>
</html>
