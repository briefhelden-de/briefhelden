      padding: 0 16px;

      letter-spacing:.2px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background: var(--accent);
      box-shadow:0 0 18px rgba(37,99,235,.7);

    .nav{ display:flex; gap:10px; flex-wrap:wrap; }
    .pill{
      border:1px solid rgba(229,231,235,.18);
      background: rgba(17,24,39,.55);
      color: var(--pillText);
      padding:10px 14px;
      border-radius:999px;
      text-decoration:none;
      font-weight:600;
      font-size:14px;
      backdrop-filter: blur(8px);

      border-radius: 10px;
      border:1px solid rgba(229,231,235,.25);
      background: rgba(17,24,39,.55);
      color: var(--pillText);
      padding:10px 12px;
      font-weight:700;
      outline:none;
      cursor:pointer;
      backdrop-filter: blur(8px);
    }
    .wrap{
      max-width: 980px;
      margin: 0 auto 40px;
      padding: 0 16px;
    }
    .card{
      background: var(--card);
      color: var(--text);
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
    }
    .headerRow{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom: 8px;
    }
    h1{
      margin:0 0 8px 0;
      font-size: 34px;
      line-height:1.15;
      letter-spacing:-.2px;
    }
    .rightTag{
      font-weight:700;
      color: var(--muted);
      white-space:nowrap;
      padding-top:8px;
    }
    .note{
      background:#f8fafc;
      border:1px solid var(--line);
      padding:12px 14px;
      border-radius:12px;
      color:#0f172a;
      margin: 10px 0 18px;
    }

    li{margin:6px 0}
    .small{color: var(--muted); font-size: 14px}

            "Неограниченная ответственность действует при умысле и грубой неосторожности, а также при вреде жизни, здоровью и телу.",
            "При лёгкой неосторожности ответственность ограничена нарушением существенных договорных обязанностей и предсказуемым типичным ущербом.",
            "Так как юридические консультации не предоставляются, мы не несём ответственность за решения/действия, принятые на основе нашего объяснения."
          ]
        },
        {
          h: "11. Доступность / технические сбои",
          p: [
            "Мы стремимся к высокой доступности сайта, но не можем исключить перерывы (обслуживание, сбои, форс-мажор).",
            "Нет права на бесперебойное использование в любое время."
          ]
        },
        {
          h: "12. Защита данных",
          p: [
            "Информация об обработке персональных данных находится в разделе <a href=\"/datenschutz\">Конфиденциальность</a>."
          ]
        },
        {
          h: "13. Заключительные положения",
          p: [
            "Применяется немецкое право (в допустимой мере), исключая CISG.",
            "Если отдельные положения недействительны, остальные положения остаются в силе."
          ]
        }
      ]
    }
  };

  const langSelect = document.getElementById("langSelect");
  const langLabel = document.getElementById("langLabel");
  const titleEl = document.getElementById("title");
  const noteEl = document.getElementById("bindingNote");
  const contentEl = document.getElementById("content");

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  function render(lang){
    const t = TEXT[lang] || TEXT.DE;
    document.documentElement.lang = (lang==="DE")?"de":(lang==="EN")?"en":(lang==="TR")?"tr":"ru";

    langLabel.textContent = t.langLabel;
    titleEl.textContent = t.title;
    noteEl.innerHTML = t.bindingNote;

    const parts = [];
    for(const s of t.sections){
      parts.push(`<h2>${escapeHtml(s.h)}</h2>`);
      if(s.p){
        for(const para of s.p){
          parts.push(`<p>${para}</p>`);
        }
      }
      if(s.ul){
        parts.push("<ul>");
        for(const li of s.ul){
          parts.push(`<li>${escapeHtml(li)}</li>`);
        }
        parts.push("</ul>");
      }
    }
    contentEl.innerHTML = parts.join("\n");
  }

  function getLangFromUrl(){
    const url = new URL(window.location.href);
    const q = (url.searchParams.get("lang") || "").toUpperCase().trim();
    if(["DE","EN","TR","RU"].includes(q)) return q;
    return null;
  }

  const saved = (localStorage.getItem("briefhelden_lang") || "").toUpperCase();
  const fromUrl = getLangFromUrl();
  const initial = fromUrl || (["DE","EN","TR","RU"].includes(saved) ? saved : "DE");

  langSelect.value = initial;
  render(initial);

  langSelect.addEventListener("change", () => {
    const lang = langSelect.value;
    localStorage.setItem("briefhelden_lang", lang);
    render(lang);

    const url = new URL(window.location.href);
    url.searchParams.set("lang", lang);
    window.history.replaceState({}, "", url.toString());
  });
})();
</script>
</body>
